<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kaiju vs Mech: WebXR Asymmetric Brawl</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
    
    #ui-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 15px;
    }
    
    .interactive { pointer-events: auto; }
    
    #lobby {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 20, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 20;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background: #00e5ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
      text-align: center;
      width: 180px;
    }

    .hud {
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* Fixed display rule for touch controls */
    #touch-controls {
      display: none; 
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 0 20px;
    }

    .dpad-btn {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.4);
      border: 2px solid #fff;
      border-radius: 50%;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <div style="display: flex; justify-content: space-between; width: 100%;">
      <div class="hud" id="city-hud">City Integrity: 100%</div>
      <div class="hud" id="kaiju-hud">Kaiju HP: 1000</div>
    </div>

    <div id="touch-controls" class="interactive">
      <div style="display: grid; grid-template-columns: repeat(3, 50px); gap: 5px;">
        <div></div><div class="dpad-btn" id="btn-up">▲</div><div></div>
        <div class="dpad-btn" id="btn-left">◄</div><div></div><div class="dpad-btn" id="btn-right">►</div>
        <div></div><div class="dpad-btn" id="btn-down">▼</div><div></div>
      </div>
      <button id="btn-fire" style="background: #ff0055; color: white; width: 70px; height: 70px; border-radius: 50%;">FIRE</button>
    </div>
  </div>

  <div id="lobby">
    <h1>KAIJU vs MECH</h1>
    <p>Select your role:</p>
    <div style="margin-bottom: 20px;">
      <button class="interactive" onclick="initHost()">Host Game (Kaiju / VR)</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <input type="text" id="room-input" placeholder="Room Code" class="interactive">
      <button class="interactive" onclick="initClient()">Join Game (Mech / Mobile)</button>
    </div>
    <p id="status-text" style="color: #ffca28; margin-top: 15px; padding: 0 20px; text-align: center;"></p>
  </div>

  <a-scene embedded vr-mode-ui="enabled: true">
    <a-sky color="#0d0f18"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#1a1c23"></a-plane>

    <!-- Buildings -->
    <a-entity id="city">
      <a-box class="building" position="-10 5 -10" width="6" height="10" depth="6" color="#3a415a"></a-box>
      <a-box class="building" position="10 7 -10" width="6" height="14" depth="6" color="#3a415a"></a-box>
      <a-box class="building" position="-10 4 10" width="6" height="8" depth="6" color="#3a415a"></a-box>
      <a-box class="building" position="10 8 10" width="6" height="16" depth="6" color="#3a415a"></a-box>
    </a-entity>

    <!-- Civilians -->
    <a-entity id="civilians">
      <a-sphere class="civilian" position="-5 0.5 -5" radius="0.5" color="#00ff66"></a-sphere>
      <a-sphere class="civilian" position="5 0.5 5" radius="0.5" color="#00ff66"></a-sphere>
    </a-entity>

    <!-- Kaiju Rig -->
    <a-entity id="kaiju-rig" position="0 0 0">
      <a-camera id="kaiju-camera" position="0 15 20" look-controls active="true"></a-camera>
      <a-entity id="left-hand" hand-controls="hand: left"></a-entity>
      <a-entity id="right-hand" hand-controls="hand: right"></a-entity>
    </a-entity>

    <!-- Mech Rig -->
    <a-entity id="mech" position="0 0.75 0">
      <a-box width="1.5" height="1.5" depth="1.5" color="#ff2a2a">
        <a-box position="0 0.5 -0.8" width="0.4" height="0.4" depth="0.8" color="#111"></a-box>
      </a-box>
      <a-camera id="mech-camera" position="0 4 8" rotation="-20 0 0" active="false" look-controls="enabled: false"></a-camera>
    </a-entity>

    <a-ambient-light color="#404040"></a-ambient-light>
    <a-directional-light position="10 20 15" intensity="0.8"></a-directional-light>
  </a-scene>

  <script>
    let peer = null;
    let conn = null;
    let role = null;

    const mechEl = document.getElementById('mech');
    const statusText = document.getElementById('status-text');
    const lobbyEl = document.getElementById('lobby');

    function initHost() {
      const roomId = Math.floor(1000 + Math.random() * 9000).toString();
      role = 'kaiju';
      statusText.innerText = "Connecting to network...";

      peer = new Peer(roomId);
      
      peer.on('open', (id) => {
        statusText.innerText = `ROOM CODE: ${id}\nOpen this site on your phone and enter this code!`;
      });

      peer.on('connection', (connection) => {
        conn = connection;
        setupNetworking();
        startGame();
      });

      peer.on('error', (err) => {
        statusText.innerText = "Error creating room: " + err.type;
      });
    }

    function initClient() {
      const roomId = document.getElementById('room-input').value.trim();
      if (!roomId) {
        alert('Please enter a Room ID');
        return;
      }
      
      role = 'mech';
      statusText.innerText = "Connecting to Kaiju host...";
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(roomId);
        setupNetworking();
        
        conn.on('open', () => {
          startGame();
        });
      });

      peer.on('error', (err) => {
        statusText.innerText = "Could not find host. Check the code and try again.";
      });
    }

    function setupNetworking() {
      conn.on('data', (data) => {
        if (data.type === 'mech-transform') {
          mechEl.setAttribute('position', data.position);
        }
      });
    }

    function startGame() {
      lobbyEl.style.display = 'none';

      if (role === 'mech') {
        document.getElementById('mech-camera').setAttribute('active', 'true');
        document.getElementById('kaiju-camera').setAttribute('active', 'false');
        document.getElementById('touch-controls').style.display = 'flex';
        setupMechControls();
      } else {
        statusText.innerText = "Connected! Put on your headset or play in browser.";
      }
    }

    function setupMechControls() {
      const speed = 0.4;
      let pos = { x: 0, y: 0.75, z: 0 };

      function move(dx, dz) {
        pos.x += dx;
        pos.z += dz;
        mechEl.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);

        if (conn && conn.open) {
          conn.send({
            type: 'mech-transform',
            position: `${pos.x} ${pos.y} ${pos.z}`
          });
        }
      }

      const bindTouch = (id, dx, dz) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); move(dx, dz); });
        el.addEventListener('click', () => move(dx, dz));
      };

      bindTouch('btn-up', 0, -speed);
      bindTouch('btn-down', 0, speed);
      bindTouch('btn-left', -speed, 0);
      bindTouch('btn-right', speed, 0);
    }
  </script>
</body>
</html>
